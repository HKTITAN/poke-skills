name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install skills-ref
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/agentskills/agentskills.git@main#subdirectory=skills-ref"

      - name: Validate each skill against the Agent Skills spec
        run: |
          set -euo pipefail
          fail=0
          for dir in skills/*/; do
            skill=$(basename "$dir")
            echo "::group::Validating $skill"
            if ! skills-ref validate "$dir"; then
              echo "::error::Skill '$skill' failed spec validation"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            **/*.md
            !node_modules

      - name: Check intra-repo wikilink targets resolve
        run: node scripts/check-wikilinks.mjs

      - name: Confirm SKILL.md `name` matches parent dir
        run: |
          set -euo pipefail
          fail=0
          for skill in skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$skill")")
            name=$(awk '/^name:/{print $2; exit}' "$skill")
            if [ "$name" != "$dir" ]; then
              echo "::error file=$skill::name '$name' does not match directory '$dir'"
              fail=1
            fi
          done
          exit $fail
